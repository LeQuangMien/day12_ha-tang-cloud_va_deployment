<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot — Agent vs LLM</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">💬</span>
          <span class="logo-text">Chatbot Lab</span>
        </div>
      </div>

      <!-- Mode Switcher -->
      <div class="mode-switcher">
        <button class="mode-btn active" data-mode="agent">
          <span class="mode-icon">🤖</span>
          <span>Agent</span>
        </button>
        <button class="mode-btn" data-mode="llm">
          <span class="mode-icon">⚡</span>
          <span>LLM</span>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Cuộc trò chuyện mới
      </button>

      <!-- Chat history — Agent -->
      <div class="sidebar-section" id="historyAgent">
        <p class="section-label">🤖 Agent</p>
        <div class="chat-history" id="chatHistoryAgent"></div>
      </div>

      <!-- Chat history — LLM -->
      <div class="sidebar-section" id="historyLLM">
        <p class="section-label">⚡ LLM Direct</p>
        <div class="chat-history" id="chatHistoryLLM"></div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="avatar-small">G</div>
          <span>Giang</span>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main">
      <!-- Top Bar -->
      <header class="topbar">
        <button class="menu-btn" id="menuBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Topbar mode toggle -->
        <div class="topbar-mode-toggle">
          <button class="topbar-mode-btn active" data-mode="agent">
            <span>🤖</span> Agent
          </button>
          <button class="topbar-mode-btn" data-mode="llm">
            <span>⚡</span> LLM
          </button>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" id="clearBtn" title="Xóa cuộc trò chuyện">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages -->
      <div class="messages-container" id="messagesContainer">
        <!-- Welcome Screen — Agent -->
        <div class="welcome" id="welcomeAgent">
          <div class="welcome-icon">🤖</div>
          <h1>ReAct Agent</h1>
          <p class="welcome-sub">Sử dụng mô hình <strong>Thought → Action → Observation</strong> để suy luận và gọi công cụ.</p>
          <div class="suggestions">
            <button class="suggestion-card" data-prompt="ReAct Agent là gì?">
              <span class="suggestion-icon">💡</span>
              <div>
                <p class="suggestion-title">ReAct Agent là gì?</p>
                <p class="suggestion-desc">Giải thích mô hình suy luận ReAct</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="Cho tôi ví dụ về Thought-Action-Observation loop">
              <span class="suggestion-icon">🔄</span>
              <div>
                <p class="suggestion-title">Thought-Action-Observation</p>
                <p class="suggestion-desc">Ví dụ minh họa vòng lặp ReAct</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="Làm thế nào để implement tool calling?">
              <span class="suggestion-icon">🛠️</span>
              <div>
                <p class="suggestion-title">Implement Tool Calling</p>
                <p class="suggestion-desc">Hướng dẫn cách gọi công cụ</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="So sánh Chatbot thường vs ReAct Agent">
              <span class="suggestion-icon">⚖️</span>
              <div>
                <p class="suggestion-title">Chatbot vs ReAct Agent</p>
                <p class="suggestion-desc">So sánh hai phương pháp</p>
              </div>
            </button>
          </div>
        </div>

        <!-- Welcome Screen — LLM -->
        <div class="welcome" id="welcomeLLM" style="display:none;">
          <div class="welcome-icon">⚡</div>
          <h1>LLM Direct</h1>
          <p class="welcome-sub">Gọi thẳng đến <strong>LLM Provider</strong> — không qua Agent, phản hồi nhanh và đơn giản.</p>
          <div class="suggestions">
            <button class="suggestion-card" data-prompt="Giải thích sự khác biệt giữa list và tuple trong Python">
              <span class="suggestion-icon">🐍</span>
              <div>
                <p class="suggestion-title">List vs Tuple Python</p>
                <p class="suggestion-desc">So sánh hai cấu trúc dữ liệu</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="Viết hàm Python tính giai thừa bằng đệ quy">
              <span class="suggestion-icon">🔢</span>
              <div>
                <p class="suggestion-title">Tính giai thừa</p>
                <p class="suggestion-desc">Viết hàm đệ quy đơn giản</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="REST API là gì? Cho ví dụ đơn giản">
              <span class="suggestion-icon">🌐</span>
              <div>
                <p class="suggestion-title">REST API là gì?</p>
                <p class="suggestion-desc">Giải thích khái niệm cơ bản</p>
              </div>
            </button>
            <button class="suggestion-card" data-prompt="Dịch câu này sang tiếng Anh: Hôm nay thời tiết đẹp quá">
              <span class="suggestion-icon">🌍</span>
              <div>
                <p class="suggestion-title">Dịch thuật</p>
                <p class="suggestion-desc">Dịch Việt → Anh đơn giản</p>
              </div>
            </button>
          </div>
        </div>

        <!-- Messages will be injected here -->
        <div id="messagesList"></div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <button class="attach-btn" title="Đính kèm tệp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea
            id="messageInput"
            placeholder="Nhập tin nhắn cho ReAct Agent..."
            rows="1"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="input-hint" id="inputHint">ReAct Agent — suy luận đa bước, gọi tool tự động.</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
